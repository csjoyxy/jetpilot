name: build-jetsampilot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "src/**"
      - ".github/workflows/build-jetsampilot.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build daemon
        working-directory: src
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -O2 -Wall \
            -miphoneos-version-min=15.0 \
            jetsampilotd.c -o jetsampilotd
          ldid -Sentitlements-daemon.plist jetsampilotd

      - name: Build app
        working-directory: src
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -O2 -Wall -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore \
            app/main.m -o JetsamPilot
          ldid -Sentitlements-app.plist JetsamPilot

      - name: Package tipa
        working-directory: src
        run: |
          mkdir -p Payload/JetsamPilot.app
          cp app/Info.plist Payload/JetsamPilot.app/
          cp app/Icon-*.png Payload/JetsamPilot.app/
          cp JetsamPilot jetsampilotd Payload/JetsamPilot.app/
          chmod 755 Payload/JetsamPilot.app/JetsamPilot Payload/JetsamPilot.app/jetsampilotd
          zip -qr JetsamPilot.tipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: JetsamPilot
          path: src/JetsamPilot.tipa

      # 打 tag（如 v0.1.1）并 push 后，自动把 .tipa 挂到对应 Release 下
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/JetsamPilot.tipa
