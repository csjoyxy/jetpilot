name: build-jetpilot

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "review/**"   # 预览分支：推分支即 CI 出包，真机验证 ok 才合 main
    tags:
      - "v*"
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/build-jetpilot.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Check release gate
        run: bash scripts/check-release.sh

      - name: Set commit env and inject into Info.plist
        run: |
          COMMIT="$(git rev-parse --short=7 HEAD)"
          echo "JP_COMMIT=$COMMIT" >> $GITHUB_ENV
          plutil -replace JPGitCommit -string "$COMMIT" src/app/Info.plist || plutil -insert JPGitCommit -string "$COMMIT" src/app/Info.plist

      - name: Build daemon
        working-directory: src
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -O2 -Wall \
            -miphoneos-version-min=15.0 \
            -DJP_COMMIT=\"${{ env.JP_COMMIT }}\" \
            -framework CoreFoundation \
            jetpilotd.c -o jetpilotd
          ldid -Sentitlements-daemon.plist jetpilotd

      - name: Build app
        working-directory: src
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -O2 -Wall -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -DJP_COMMIT=\"${{ env.JP_COMMIT }}\" \
            -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore \
            app/main.m -o JetPilot
          ldid -Sentitlements-app.plist JetPilot

      - name: Package tipa
        working-directory: src
        run: |
          mkdir -p Payload/JetPilot.app
          cp app/Info.plist Payload/JetPilot.app/
          cp app/Icon-*.png Payload/JetPilot.app/
          cp JetPilot jetpilotd Payload/JetPilot.app/
          chmod 755 Payload/JetPilot.app/JetPilot Payload/JetPilot.app/jetpilotd
          zip -qr JetPilot.tipa Payload

      - name: Verify package signature and entitlements
        run: bash scripts/check-release.sh --artifact src/JetPilot.tipa

      - uses: actions/upload-artifact@v4
        with:
          name: JetPilot
          path: |
            src/JetPilot.tipa
            src/JetPilot.tipa.verification

      # 打 tag（如 v0.1.1）并 push 后，自动把 .tipa 挂到对应 Release 下
      - name: Check package verification status before release
        if: startsWith(github.ref, 'refs/tags/')
        id: check_release
        run: |
          STATUS_FILE="src/JetPilot.tipa.verification"
          if [ ! -f "$STATUS_FILE" ]; then
            echo "::error::Missing verification status file: $STATUS_FILE. Refusing to release unverified package."
            echo "skip_release=true" >> $GITHUB_OUTPUT
          elif grep -q "^STATUS: UNVERIFIED" "$STATUS_FILE"; then
            echo "::error::Package signature verification failed (UNVERIFIED)! Refusing to attach to GitHub Release."
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "Package verification confirmed VERIFIED. Eligible for Release."
            echo "skip_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.check_release.outputs.skip_release != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: src/JetPilot.tipa
